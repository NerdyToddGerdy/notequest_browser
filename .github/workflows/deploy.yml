name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one run at a time *per ref*: a new push to main cancels an in-flight main run, but a pull
# request can never cancel a deploy of main (which a single shared `pages` group would allow).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # v5 majors (issue #106) run on the Node 24 action runtime; v4 targeted the deprecated Node 20
      # and was being force-upgraded by the runner. Two behavior changes were checked and don't
      # apply here: setup-node v5 auto-enables caching when `package.json` has a `packageManager`
      # field (it doesn't, so the explicit `cache: npm` below stays authoritative), and checkout
      # v5.1 hardened fork checkouts for `pull_request_target`/`workflow_run` only -- the ordinary
      # `pull_request` event this workflow uses is explicitly unchanged.
      - uses: actions/setup-node@v5
        with:
          # Pinned to the floor some devDependencies actually want (>=20.19). A bare `20` resolves
          # to the latest 20.x, which happens to satisfy that today, but locally Node 20.17 prints
          # EBADENGINE -- pinning removes the discrepancy rather than leaving CI quietly luckier
          # than a developer's machine.
          node-version: "20.19"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      # The e2e suite runs last: it's the slowest step (a browser download), so the cheap checks
      # above get to fail first. It lives in this job rather than a parallel one because the whole
      # suite takes ~5s -- a separate job would spend far longer re-doing checkout and `npm ci`
      # than it could save, and being here means `deploy` is already gated on it via `needs: build`.
      # Only chromium is installed; `playwright.config.ts` defines no other project.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Makes a CI-only failure debuggable: the HTML report embeds the trace captured on the first
      # retry (see `trace: "on-first-retry"` / `retries: 2` in playwright.config.ts).
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Skipped on pull requests: nothing will deploy it, and a fork PR's read-only token can't
      # upload it anyway. `npm run build` above still runs on a PR -- it's the typecheck.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # A pull request runs every check above but must never publish -- only a push to main deploys.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
